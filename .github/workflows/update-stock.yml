name: Update GigaParts stock

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-stock:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore previous stock history
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock-history"
          if git ls-remote --exit-code --heads origin stock-history >/dev/null 2>&1; then
            git fetch --depth=1 origin stock-history
            git archive --format=tar FETCH_HEAD | tar -x -C "$RUNNER_TEMP/stock-history"
            if [ -f "$RUNNER_TEMP/stock-history/latest/stock-data.json" ]; then
              cp "$RUNNER_TEMP/stock-history/latest/stock-data.json" stock-data.json
            fi
          fi

      - name: Build stock snapshot
        run: python build.py

      - name: Post stock notifications
        continue-on-error: true
        env:
          NOTIFY_WORKER_URL: ${{ secrets.NOTIFY_WORKER_URL }}
          NOTIFY_WORKER_TOKEN: ${{ secrets.NOTIFY_WORKER_TOKEN }}
        run: python scripts/post_stock_events.py

      - name: Update compact stock history
        run: |
          python scripts/update_stock_history.py \
            --history-root "$RUNNER_TEMP/stock-history" \
            --site-history-root "$RUNNER_TEMP/site/history"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html stock-data.json manifest.webmanifest sw.js "$RUNNER_TEMP/site/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit compact stock history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stock-history >/dev/null 2>&1; then
            git fetch --depth=1 origin stock-history
            git switch --detach FETCH_HEAD
            git switch -c stock-history
            git rm -rf .
          else
            git switch --orphan stock-history
            git rm -rf . || true
          fi
          cp -R "$RUNNER_TEMP/stock-history/." .
          touch .nojekyll
          git add .nojekyll latest events metrics
          if git diff --cached --quiet; then
            echo "No stock history changes to commit."
          else
            git commit -m "Update compact stock history"
            git push origin HEAD:stock-history
          fi
